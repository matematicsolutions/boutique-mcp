[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boutique-mcp"
version = "0.2.2"
description = "Local MCP catalog of MateMatic Boutique: find the right legal-data connector or skill and get a local install command. No proxy, no query logging."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Matematic Solutions", email = "kontakt@matematic.co" },
    { name = "Wieslaw Mazur", email = "mazur.wieslaw2022@gmail.com" },
]
keywords = ["mcp", "legaltech", "catalog", "discovery", "boutique"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Repository = "https://github.com/matematicsolutions/boutique-mcp"
Issues = "https://github.com/matematicsolutions/boutique-mcp/issues"
Homepage = "https://matematicsolutions.com/boutique"

[project.scripts]
boutique-mcp = "boutique_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/boutique_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# INSTRUCTIONS is a long-form operational prose string shown to the LLM
"src/boutique_mcp/server.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
